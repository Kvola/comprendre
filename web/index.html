<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Remplacé par `--base-href` à la construction (scripts/build_web.sh) :
       /apps/comprendre/web/, l'adresse où le serveur sert l'application. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Transformez un texte en quiz de compréhension.">
  <meta name="theme-color" content="#0E5E6F">

  <!-- iPhone / iPad : « Sur l'écran d'accueil » -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Comprendre">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Comprendre</title>

  <style>
    html, body { margin: 0; height: 100%; background: #0E5E6F; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff;
    }
    #splash img { width: 96px; height: 96px; border-radius: 22px; }
    #splash .bar { width: 120px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #fff;
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <!-- Visible pendant le chargement (quelques secondes sur un réseau mobile),
       retiré à la première image de l'application. -->
  <div id="splash" role="progressbar" aria-label="Chargement de Comprendre">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
  </div>
  <noscript>
    <p style="color:#fff;font-family:sans-serif;text-align:center;padding:24px">
      Comprendre a besoin de JavaScript. Activez-le dans les réglages du navigateur.
    </p>
  </noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) splash.remove();
      // Au tout premier passage, le moteur graphique et les polices sont
      // chargés AVANT que sw.js ne prenne la main : il ne les a pas vus
      // passer. On lui donne la liste de ce qui a réellement servi (la bonne
      // variante de CanvasKit pour CE navigateur), pour un démarrage hors ligne.
      if ('serviceWorker' in navigator && window.performance) {
        navigator.serviceWorker.ready.then(function (reg) {
          var urls = performance.getEntriesByType('resource').map(function (e) { return e.name; });
          if (reg.active) reg.active.postMessage({ type: 'keep', urls: urls });
        }).catch(function () {});
      }
    });
    // Hors ligne une fois installée : voir sw.js. Un échec ici ne doit jamais
    // empêcher l'application de démarrer.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
